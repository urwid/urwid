[tox]
requires =
  tox>=4.57
  tox-uv>=1
envlist =
  py31{1,2,3,4,5}
  py31{3,4,5}t
  pypy31{1,2}
  graalpy31{2,3}
  ruff
  pylint
  mypy
  pyrefly
  refurb
skip_missing_interpreters = True

[testenv]
usedevelop = true
# In a parallel run (tox -p) unit tests wait for the static checks, so a broken change fails before the test load starts.
depends =
  ruff
  pylint
  mypy
  pyrefly
  refurb
dependency_groups = pytest
# Default extras for CPython: include all for maximum coverage
extras =
  curses
  serial
  tornado
  trio
  twisted
  zmq
commands =
  pytest

[testenv:py31{3,4,5}t]
# Freethreaded Python (PEP 703): --disable-gil build
# Tox native 't' factor for freethreaded Python (automatically uses python*-nogil)
# Excludes glib, zmq (no free-threading wheels)
usedevelop = true
dependency_groups = pytest
extras =
  curses
  serial
  tornado
  trio
  twisted
commands =
  pytest
setenv =
  PYTHONWARNDEFAULTENCODING=1

[testenv:pypy31{1,2}]
# PyPy has issues with some C extensions, skip problematic ones
usedevelop = true
# Alternative implementations run after every CPython environment.
depends =
  {[testenv]depends}
  py31{1,2,3,4,5}
  py31{3,4,5}t
dependency_groups = pytest
# PyPy doesn't properly support pygobject (glib) or has issues with pyzmq
extras =
  serial
  tornado
  trio
commands =
  pytest
setenv =
  PYTHONWARNDEFAULTENCODING=1

[testenv:graalpy31{2,3}]
# GraalPy (Oracle's Python implementation on GraalVM) - experimental support
# GraalPy has limited C extension support, skip problematic ones
usedevelop = true
# GraalPy's JIT warm-up starves next to other environments, so each one runs last and alone.
depends =
  {[testenv]depends}
  py31{1,2,3,4,5}
  py31{3,4,5}t
  pypy31{1,2}
  graalpy313: graalpy312
dependency_groups = pytest
# GraalPy doesn't support pygobject (glib), pyzmq, or twisted well
extras =
  serial
  tornado
# Coverage tracing slows GraalPy down by orders of magnitude (one test: 5 s without, over 10 min with).
# Its JIT can be far slower on a cold or loaded machine than the 3.7 s its slowest test took on a workstation,
# so it gets a wider per-test timeout than the project's 300 s.
commands =
  pytest --no-cov --timeout=600
setenv =
  PYTHONWARNDEFAULTENCODING=1

[testenv:readme]
dependency_groups = build
extras =
commands =
  python -m build
  twine check {toxinidir}/dist/*

[testenv:ruff]
skip_install = true
depends =
dependency_groups = ruff
extras =
commands =
  ruff format --check .
  ruff check .

[testenv:docs]
dependency_groups = documentation
extras =
  {[testenv]extras}
  glib
commands = sphinx-build docs/ build/documentation

[testenv:pylint]
base_python = py314
depends = ruff
dependency_groups = pylint
extras =
  {[testenv]extras}
  glib
# tests are not checked, see [tool.ruff] extend-exclude in pyproject.toml
commands = pylint urwid

[testenv:refurb]
depends = ruff
deps = refurb
extras =
# tests are not checked, see [tool.ruff] extend-exclude in pyproject.toml
commands = refurb urwid examples

[testenv:mypy]
base_python = py314
depends = ruff
dependency_groups = mypy
# tests other than tests/type_checks are not checked, see [tool.ruff] extend-exclude in pyproject.toml
commands = mypy urwid examples tests/type_checks

[testenv:pyrefly]
base_python = py314
depends = ruff
dependency_groups = pyrefly
commands = pyrefly check

[testenv:pyright]
# Run on demand with `tox -e pyright`: it is not in envlist, and CI does not run it.
base_python = py314
depends = ruff
dependency_groups = pyright
commands = pyright
