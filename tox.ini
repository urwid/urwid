[tox]
requires =
  tox>=4.57
  tox-uv>=1
envlist =
  py3{9,10,11,12,13,14,15}
  py31{3,4,5}t
  pypy3
  graalpy31{1,2}
  ruff
  pylint
  mypy
  refurb
skip_missing_interpreters = True

[testenv]
usedevelop = true
dependency_groups = pytest
# Default extras for CPython: include all for maximum coverage
extras =
  curses
  serial
  tornado
  trio
  twisted
  zmq
commands =
  pytest

[testenv:py31{3,4,5}t]
# Freethreaded Python (PEP 703): --disable-gil build
# Tox native 't' factor for freethreaded Python (automatically uses python*-nogil)
# Twisted 24.10.0+ supports free-threading. Excludes glib, zmq (no free-threading wheels)
usedevelop = true
dependency_groups = pytest
extras =
  curses
  serial
  tornado
  trio
  twisted
commands =
  pytest
setenv =
  PYTHONWARNDEFAULTENCODING=1

[testenv:pypy3]
# PyPy has issues with some C extensions, skip problematic ones
usedevelop = true
dependency_groups = pytest
# PyPy doesn't properly support pygobject (glib) or has issues with pyzmq
extras =
  serial
  tornado
  trio
commands =
  pytest
setenv =
  PYTHONWARNDEFAULTENCODING=1

[testenv:graalpy31{1,2}]
# GraalPy (Oracle's Python implementation on GraalVM) - experimental support
# GraalPy has limited C extension support, skip problematic ones
usedevelop = true
dependency_groups = pytest
# GraalPy doesn't support pygobject (glib), pyzmq, or twisted well
extras =
  serial
  tornado
commands =
  pytest
setenv =
  PYTHONWARNDEFAULTENCODING=1

[testenv:readme]
dependency_groups = build
extras =
commands =
  python -m build
  twine check {toxinidir}/dist/*

[testenv:ruff]
skip_install = true
depends =
dependency_groups = ruff
extras =
commands =
  ruff format --check .
  ruff check .

[testenv:docs]
dependency_groups = documentation
extras =
  {[testenv]extras}
  glib
commands = sphinx-build docs/ build/documentation

[testenv:pylint]
depends = ruff
dependency_groups = pylint
extras =
  {[testenv]extras}
  glib
commands = pylint urwid

[testenv:refurb]
depends = ruff
deps = refurb
extras =
commands = refurb urwid examples

[testenv:mypy]
depends = ruff
dependency_groups = mypy
commands = mypy urwid examples
