[build-system]
build-backend = "setuptools.build_meta"
# Minimum requirements for the build system to execute.
# PEP 508 specifications for PEP 518.
requires = [
  "setuptools>=80.8.0",
  "setuptools-scm[toml]>=8.1.0",
]

[project]
name = "urwid"
description = "A full-featured console (xterm et al.) user interface library"
readme = { file = "README.rst", content-type = "text/x-rst" }
keywords = [ "console", "curses", "listbox", "ncurses", "scroll", "text layout", "ui", "user interface", "widget" ]
license = "LGPL-2.1-only"  # Use SPDX classifier
license-files = [ "COPYING" ]
requires-python = ">=3.11.0"
dynamic = [ "classifiers", "dependencies", "version" ]
[[project.authors]]
name = "Ian Ward"
email = "ian@excess.org"
[project.optional-dependencies]
curses = [ "windows-curses; sys_platform=='win32'" ]
glib = [ "pygobject" ]
# Floors below are the oldest releases without known CVEs (only the IOLoop/reactor APIs are used by urwid,
# but the extras pull the whole distribution into the user environment).
tornado = [ "tornado>=6.5.8" ]
trio = [ "trio>=0.31.0" ]
twisted = [ "twisted>=26.4.0" ]
# `zmq` on PyPI is an abandoned 2015 placeholder ("You are probably looking for pyzmq") with no dependencies:
# it does not provide the `zmq` module that urwid.event_loop.zmq_loop imports.
zmq = [ "pyzmq>=26.0.0" ]
# for lcd_display
serial = [ "pyserial" ]
lcd = [ "pyserial" ]
[project.urls]
Homepage = "https://urwid.org/"
Documentation = "https://urwid.org/manual/index.html"
Repository = "https://github.com/urwid/urwid"
"Bug Tracker" = "https://github.com/urwid/urwid/issues"

[dependency-groups]
dev = [
  { include-group = "build" },
  { include-group = "documentation" },
  { include-group = "lint" },
  { include-group = "mypy" },
  { include-group = "pre-commit" },
  { include-group = "pylint" },
  { include-group = "pyrefly" },
  { include-group = "pytest" }
]
build = [
  "build",
  "twine",
]
documentation = [
  "sphinx",
]
lint = [
  "pyproject-fmt",
  "yamllint",
  { include-group = "ruff" },
]
mypy = [
  "mypy[faster-cache,reports]",
  "types-pyserial",
]
pre-commit = [
  "prek",
]
pylint = [
  "pylint",
]
pyrefly = [
  "pyrefly",
  "types-pyserial",
]
pytest = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
]
ruff = [
  "ruff",
]

[tool.setuptools]
platforms = [ "unix-like" ]
zip-safe = false
[tool.setuptools.packages.find]
include = [
  "urwid",
  "urwid.*",
]
namespaces = false
[tool.setuptools.package-data]
urwid = [ "py.typed" ]
[tool.setuptools.dynamic]
classifiers = { file = [ "classifiers.txt" ] }
dependencies = { file = [ "requirements.txt" ] }

[tool.distutils.bdist_wheel]
universal = 0

[tool.setuptools_scm]
write_to = "urwid/version.py"

[tool.cibuildwheel]
# Disable building PyPy wheels on all platforms
# Disable musllinux as not popular platform
skip = [ "pp*", "*-musllinux_*" ]

[tool.ruff]
target-version = "py311"
line-length = 120
# The test suite is not checked by ruff, mypy, pyrefly, pylint or refurb yet: it is not clean against their
# rule sets, and that is a gap to close rather than a decision.
# tests/type_checks is the exception for mypy and pyrefly: it is a fixture written for them, and they check it.
extend-exclude = [ "tests" ]
output-format = "full"
[tool.ruff.format]
docstring-code-format = true
[tool.ruff.lint.per-file-ignores]
"__init__.py" = [ "F401", "SIM105" ]
"urwid/display/curses.py" = [ "A005" ]
# Shown verbatim in the docs as numbered listings, wcur2.py from a fixed line (`:lines: 7-`).
"docs/tutorial/*.py" = [ "D100", "D101", "D102", "D103", "D107" ]
"docs/manual/*.py" = [ "D100", "D101", "D102", "D103", "D107" ]
[tool.ruff.lint.isort]
known-third-party = []
[tool.ruff.lint.pydocstyle]
convention = "pep257"
[tool.ruff.lint.pylint]
allow-dunder-method-names = [
  "__rich_repr__",
  "_contents__delitem__", # class generation
  "_contents__getitem__", # class generation
  "_contents__setitem__", # class generation
]
[tool.ruff.lint]
extend-select = [
  "A",     # flake8-builtins
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "D",     # pydocstyle
  "E",     # pycodestyle errors
  "EXE",   # flake8-executable
  "F",     # pyflakes
  "FA",    # flake8-future-annotations
  "FLY",   # flynt
  "FURB",  # refurb
  "I",     # isort
  "ICN",   # flake8-import-conventions
  "ISC",   # flake8-implicit-str-concat
  "PERF",  # perflint
  "PGH",   # pygrep-hooks
  "PIE",   # flake8-pie
  "PL",    # pylint
  "PYI",   # flake8-pyi
  "Q",     # flake8-quotes
  "RET",   # flake8-return
  "RUF",   # Ruff-specific rules
  "S",     # flake8-bandit
  "SIM",   # flake8-simplify
  "SLOT",  # flake8-slots
  "T10",   # flake8-debugger
  "TC",    # flake8-type-checking
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
]
extend-ignore = [
  "E203",    # handled by formatter
  "E221",    # handled by formatter
  "E222",    # handled by formatter
  "ISC001",  # conflicts with the formatter, which can produce single-line implicit concatenation
  "PLC0415", # We have a lot of imports outside top-level
  "PLR0904", # refactor rule: too many public methods
  "PLR0911", # refactor rule: too many return statements
  "PLR0912", # refactor rule: too many branches
  "PLR0913", # refactor rule: too many arguments
  "PLR0914", # refactor rule: too many locals
  "PLR0915", # refactor rule: too many statements
  "PLR0917", # refactor rule: too many positional arguments
  "PLR2004", # magic value comparison
  "PLR6301", # no-self-use
  "PYI063",  # MonitoredList is a list subclass, this expected to change
  "RET504",  # Unnecessary variable assignment before a return statement
  # suspicious-xml-*-usage: recommend defusedxml, which is not a dependency
  "S313",
  "S314",
  "S315",
  "S316",
  "S317",
  "S318",
  "S319",
  "SIM108",  # Use ternary operator,
  "TRY003",  # long messages prepare outside, ...
]
# Codes only standalone refurb implements, suppressed inline for refurb.
external = [ "FURB123", "FURB143" ]

[tool.pylint]
disable = [
  "arguments-differ",
  "broad-exception-caught",
  "broad-exception-raised",
  "consider-using-assignment-expr",
  "consider-using-enumerate",                         # iterable modification during iteration
  "cyclic-import",
  "file-ignored",
  "fixme",
  "import-outside-toplevel",
  "invalid-name",
  "invalid-overridden-method",                        # Magic part
  "locally-disabled",
  "logging-format-interpolation",
  "logging-fstring-interpolation",
  "similarities",
  "superfluous-parens",
  "suppressed-message",
  "too-few-public-methods",
  "too-many-ancestors",
  "too-many-arguments",
  "too-many-branches",
  "too-many-instance-attributes",
  "too-many-lines",
  "too-many-locals",
  "too-many-nested-blocks",
  "too-many-positional-arguments",
  "too-many-public-methods",
  "too-many-return-statements",
  "too-many-statements",
  "unused-argument",
  "unused-private-member",
  "use-implicit-booleaness-not-comparison-to-string", # too complex union
  "use-implicit-booleaness-not-comparison-to-zero",
]
enable = "all"
ignore = [ "CVS", "version.py" ]
# gi (PyGObject) is only installed with the "glib" extra; static checks also run without it.
ignored-modules = [ "gi" ]
jobs = 0
load-plugins = [
  "pylint.extensions.check_elif",
  "pylint.extensions.code_style",
  "pylint.extensions.dict_init_mutate",
  "pylint.extensions.dunder",
  "pylint.extensions.for_any_all",
  "pylint.extensions.overlapping_exceptions",
  "pylint.extensions.typing",
]
max-line-length = 120
py-version = "3.11"
[tool.pylint.basic]
good-names = [
  "_",
  "bar", # we draw bars
  "ex",
  "i",
  "j",
  "k",
  "Run",
]
[tool.pylint.format]
ignore-long-lines = "^(\\s*(# )?<?https?://\\S+>?)|(.+# type: ignore\\[[\\w\\-\\,]+\\])$"
[tool.pylint.classes]
exclude-protected = [
  "_asdict",
  "_fields",
  "_invalidate",      # API
  "_make",
  "_original_widget", # API
  "_replace",
  "_repr_attrs",      # API
  "_repr_words",      # API
  "_source",
  "_w",               # API
  "os._exit",
]
[tool.pylint.dunder]
good-dunder-names = [
  "__rich_repr__",
  # class generation
  "_contents__getitem__",
  "_contents__setitem__",
  "_contents__delitem__",
]

[tool.pyproject-fmt]
# After how many columns split arrays/dicts into multiple lines and wrap long strings;
# use a trailing comma in arrays to force multiline format instead of lowering this value
column_width = 120
# Keep full version numbers (e.g., 1.0.0 instead of 1.0) in dependency specifiers
keep_full_version = true
generate_python_version_classifiers = false
# Table format: "short" collapses sub-tables to dotted keys, "long" expands to [table.subtable] headers
table_format = "long"

[tool.mypy]
python_version = "3.11"
strict = true
show_error_context = true
show_column_numbers = true
pretty = true
[[tool.mypy.overrides]]
module = "urwid.display.curses"
disable_error_code = [
  "union-attr", # chacking for started state before each operation if too expensive
]

[[tool.mypy.overrides]]
module = "urwid.display._win32"
disable_error_code = [
  # `ctypes.windll` and friends exist only on Windows in typeshed, while this module is Windows-only by design:
  # checking it from a non-Windows host produces platform-specific noise instead of real issues.
  "attr-defined",
]

[[tool.mypy.overrides]]
module = "urwid.widget.constants"
disable_error_code = [
  # False positive: plain-string `Literal`s (e.g. "relative") are reported as overlapping
  # sibling `str`-based enums (`Align`/`VAlign`) in the size/alignment overloads, even though
  # the underlying values are disjoint. The public API must accept both string and enum forms.
  "overload-overlap",
]

[[tool.mypy.overrides]]
module = [ "gi.*" ]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "twisted_serve_ssh"
disable_error_code = [
  "misc",
  # twisted and zope.interface ship no type stubs, so every call into them is "untyped" to mypy,
  # and zope.interface.Interface's metaclass magic isn't something mypy's plugin-free checker understands.
  "no-untyped-call",
]

[tool.pyrefly]
python-version = "3.11.0"
# Docs are not checked; tests other than tests/type_checks are not checked, see [tool.ruff] extend-exclude.
project-includes = [ "examples", "tests/type_checks", "urwid" ]
check-unannotated-defs = true
# PyGObject is only installed with the "glib" extra, which needs system libraries.
ignore-missing-imports = [ "gi.*" ]
infer-return-types = "never"
preset = "legacy"
[tool.pyrefly.errors]
# mypy needs these casts, and its strict mode reports any that become redundant.
redundant-cast = "ignore"
no-any-return = "error"
implicit-any-parameter = "error"
unannotated-return = "error"
implicit-any = "error"
# A sub-config disables an error kind for a whole file, so it is kept for files where that is the design.
# Anything narrower is an inline "# pyrefly: ignore[...]" comment on the expression.
# Widgets override render, keypress, mouse_event and similar methods with narrower sizing signatures on purpose.
[[tool.pyrefly.sub-config]]
matches = "urwid/widget/**"
[tool.pyrefly.sub-config.errors]
bad-override = "ignore"
[[tool.pyrefly.sub-config]]
matches = "examples/**"
[tool.pyrefly.sub-config.errors]
bad-override = "ignore"
[[tool.pyrefly.sub-config]]
matches = "urwid/vterm.py"
[tool.pyrefly.sub-config.errors]
# CSI_COMMANDS is a table of lambdas, and Pyrefly does not type them from the CSICommand.callback field.
implicit-any-lambda = "ignore"
[[tool.pyrefly.sub-config]]
matches = "urwid/display/curses.py"
[tool.pyrefly.sub-config.errors]
# The curses window is None until start(), and checking for that before each operation is too expensive.
missing-attribute = "ignore"
[[tool.pyrefly.sub-config]]
matches = "urwid/display/_win32*.py"
[tool.pyrefly.sub-config.errors]
# ctypes.windll exists on Windows only, and so does this module.
missing-module-attribute = "ignore"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [ "tests", "urwid" ]
addopts = "-vvvv --doctest-modules -s --cov --cov-report=term"
doctest_optionflags = [ "DONT_ACCEPT_TRUE_FOR_1", "ELLIPSIS", "IGNORE_EXCEPTION_DETAIL" ]

[tool.coverage.run]
source_pkgs = [ "urwid" ]
omit = [ ".tox/*", "setup.py", "tests/*", "urwid/version.py" ]
branch = true
[tool.coverage.report]
exclude_lines = [
  "@abc.abstractmethod",              # abstract
  "@abstractmethod",                  # abstract
  "@overload",                        # overload stub
  "@runtime_checkable",               # protocol
  "@typing.runtime_checkable",        # protocol
  "@typing\\.overload",               # overload stub
  "^[a-zA-Z_]+\\b\\s=",               # module-level assignment, run on import
  "^\\s*\\.\\.\\.\\s*$",              # stub body
  "^from\\b",                         # import, run on import
  "^import\\b",                       # import, run on import
  "assert False",                     # defensive code tests do not reach
  "assert_never\\(",                  # defensive code tests do not reach
  "cast\\(",                          # static analysis only
  "class \\w*\\(Protocol\\):",        # protocol
  "class \\w*\\(typing.Protocol\\):", # protocol
  "class \\w*test:",                  # manual test code
  "def \\wtest():",                   # manual test code
  "def __repr__",                     # debug-only repr
  "def __rich_repr__",                # debug-only repr
  "def _repr_attrs",                  # debug-only repr
  "def _repr_words",                  # debug-only repr
  "except ImportError:",              # fallback without optional dependencies
  "if __name__ == .__main__.:",       # script entry point
  "if IS_WINDOWS",                    # OS specific
  "if os.name",                       # OS specific
  "if platform.system()",             # OS specific
  "if sys.platform",                  # OS specific
  "if TYPE_CHECKING:",                # static analysis only
  "if typing\\.TYPE_CHECKING:",       # static analysis only
  "pragma: no cover",                 # standard pragma, re-enabled because this list replaces the default
  "raise AssertionError",             # defensive code tests do not reach
  "raise NotImplementedError",        # defensive code tests do not reach
  "typing\\.assert_never",            # defensive code tests do not reach
  "typing\\.cast\\(",                 # static analysis only
]
[tool.coverage.json]
pretty_print = true

[tool.refurb]
python_version = "3.11"
ignore = [ "FURB104", "FURB144", "FURB146" ]
[[tool.refurb.amend]]
path = "urwid/__init__.py"
ignore = [ "FURB107" ]

[[tool.refurb.amend]]
path = "urwid/display/__init__.py"
ignore = [ "FURB107" ]

[[tool.refurb.amend]]
path = "urwid/event_loop/__init__.py"
ignore = [ "FURB107" ]
