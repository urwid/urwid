name: Isolated Pyrefly check

on:
  pull_request:
    paths:
      - "pyrefly-requirements.txt"
      - ".github/workflows/isolated_pyrefly.yml"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  Pyrefly:
    name: Check with Pyrefly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Create virtual environment
        run: uv venv --python 3.14
      - name: Install package with all extras
        run: uv pip install -e ".[curses,serial,tornado,trio,twisted,zmq]"
      - name: Install dependencies
        run: uv pip install --upgrade -r pyrefly-requirements.txt
      - name: Type check with Pyrefly
        run: uv run --no-project pyrefly check --output-format full-text-with-github
