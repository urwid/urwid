name: Isolated Mypy check

on:
  pull_request:
    paths:
      - "mypy-requirements.txt"
      - ".github/workflows/isolated_mypy.yml"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  Mypy:
    name: Check with mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - name: Create virtual environment
        run: uv venv --python 3.14
      - name: Install package with all extras
        run: uv pip install -e ".[curses,serial,tornado,trio,twisted,zmq]"
      - name: Install dependencies
        run: uv pip install --upgrade -r mypy-requirements.txt
      # tests other than tests/type_checks are not checked, see [tool.ruff] extend-exclude in pyproject.toml
      - name: Type check with mypy
        run: uv run --no-project mypy urwid examples tests/type_checks
