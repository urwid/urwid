name: Isolated PyLint check

on:
  pull_request:
    paths:
      - "pylint-requirements.txt"
      - ".github/workflows/isolated_pylint.yml"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  PyLint:
    name: Check with pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y python3-dev python3-gi python3-gi-cairo
          sudo apt-get install -y gobject-introspection libgirepository-2.0-dev libcairo2-dev
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Create virtual environment
        run: uv venv --python-preference only-system
      - name: Install package with all extras
        run: uv pip install -e ".[curses,glib,serial,tornado,trio,twisted,zmq]"
      - name: Install dependencies
        run: uv pip install --upgrade -r pylint-requirements.txt
      - name: Lint with pylint
        run: uv run --no-project pylint --output-format=github urwid
