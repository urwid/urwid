name: Isolated PyLint check

on:
  pull_request:
    paths:
      - "pylint-requirements.txt"
      - ".github/workflows/isolated_pylint.yml"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  PyLint:
    name: Check with pylint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
      - name: Create virtual environment
        run: uv venv
      - name: Install package with all extras
        run: uv pip install -e ".[curses,serial,tornado,trio,twisted,zmq]"
      - name: Install dependencies
        run: uv pip install --upgrade -r pylint-requirements.txt
      - name: Lint with pylint
        run: uv run --no-project pylint --output-format=github urwid
